<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAYG Solar Simulator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .pricing-section {
            margin-bottom: 30px;
            padding: 15px;
            background: #eef2f7;
            border-radius: 6px;
        }
        .simulator-box {
            border: 2px solid #3498db;
            padding: 20px;
            border-radius: 6px;
            background: #fff;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #d4edda;
            color: #155724;
            border-radius: 4px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <h1>Solar PAYG System</h1>

        <h3>System Pricing</h3>
        <p><strong>Daily Rate:</strong> KSh 50</p>
        <p><strong>Total Ownership Cost:</strong> KSh 18,000</p>
    </div>
